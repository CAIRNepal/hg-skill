<h1 id="the-heritage-challenge-himalayan-living-heritage">The Heritage Challenge: Himalayan Living Heritage</h1>
<ul>
<li data-marpit-fragment="1"><strong>Heterogeneous Physical Records</strong>: Archival survey reports (multi-page PDF), temple inventories (CSV/Excel), epigraphic inscriptions, and unstructured field journals.</li>
<li data-marpit-fragment="2"><strong>Living Heritage Complexity</strong>: Monuments in Nepal are active ritual hubs, not static monuments. They are tightly coupled to:
<ul>
<li data-marpit-fragment="3"><strong>Traditional Custodianship</strong>: <em>Guthi</em> organizations (e.g. <code>SiGuthi</code>, <code>RajGuthi</code>, <code>SanaGuthi</code>) managing rituals and conservation.</li>
<li data-marpit-fragment="4"><strong>Socio-Religious Synchronization</strong>: Syncretic worship (<em>Newar Buddhist-Hindu deities</em>, e.g. <em>Karunamaya / Rato Machhindranath</em>).</li>
<li data-marpit-fragment="5"><strong>Multiple Historical Eras</strong>: Dates recorded in <em>Nepal Sambat</em> (NS), <em>Vikram Sambat</em> (VS), <em>Shaka Sambat</em> (ŚS), and Common Era (CE).</li>
</ul>
</li>
<li data-marpit-fragment="6"><strong>The Failure of Generic Extractors</strong>: Off-the-shelf NLP or ungrounded LLM scrapers hallucinate entities, flatten relationships, destroy temporal semantics, and emit disconnected JSON rather than validated Linked Open Data (LOD).</li>
</ul>
</section>

<h1 id="what-is-heritagegraph--hg-skill">What is HeritageGraph &amp; <code>hg-skill</code>?</h1>
<ul>
<li data-marpit-fragment="1"><strong>HeritageGraph Platform (<code>heritagegraph.ttl</code>)</strong>:
<ul>
<li data-marpit-fragment="2">An open semantic knowledge graph initiative by <strong>CAIR-Nepal</strong> (<a href="https://cairnepal.github.io/heritagegraphontology/">cairnepal.github.io/heritagegraphontology</a>).</li>
<li data-marpit-fragment="3">Models monuments, intangible festivals, architectural styles, Guthis, and structural interventions.</li>
<li data-marpit-fragment="4">Canonical URI namespace: <code>https://cair-nepal.org/heritagegraph/</code> (<code>heritageGraph:</code>).</li>
</ul>
</li>
<li data-marpit-fragment="5"><strong><code>hg-skill</code> Repository</strong>:
<ul>
<li data-marpit-fragment="6">The production transformation engine converting unstructured and tabular archives into validated RDF Turtle (<code>.ttl</code>).</li>
<li data-marpit-fragment="7">Implemented as composable, modular agent skills under <code>skills/</code>:
<ul>
<li data-marpit-fragment="8">Deterministic code where precision is required (schema compilation, SHACL validation, URI minting).</li>
<li data-marpit-fragment="9">LLM/Agent-assisted capabilities where semantic inference is necessary (OCR text normalization, living heritage extraction).</li>
</ul>
</li>
</ul>
</li>
</ul>
</section>

<h1 id="pipeline-design-goals">Pipeline Design Goals</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  High Robustness           Semantic Precision          Sovereign URI Space
 (Multi-format inputs)    (LinkML &amp; CIDOC-CRM LOD)    (cair-nepal.org base)
           \                         |                         /
            \                        |                        /
             ▼                       ▼                       ▼
    +---------------------------------------------------------------+
    |         HERITAGEGRAPH SKILLS PIPELINE ARCHITECTURE            |
    +---------------------------------------------------------------+
             ▲                       ▲                       ▲
            /                        |                        \
           /                         |                         \
   Full Reproducibility       Quality Assurance       Human-in-the-Loop
 (manifest.json provenance)  (Zero vacuous SHACL)    (Staged Review Queue)
</code></pre>
<ol>
<li><strong>Deterministic Guarantees</strong>: Identical inputs and schemas produce bit-identical RDF graphs.</li>
<li><strong>Strict Validation Gates</strong>: No invalid triple enters the global Knowledge Graph; graphs must satisfy pySHACL shapes.</li>
<li><strong>Traceability</strong>: Every run records full SHA-256 digests, git commits, and tool execution logs.</li>
</ol>
</section>

+-----------------------------------------------------------------------------------+
| 00_preprocessed.json: Cleaned text, tables, living heritage tags (Guthi, Era, etc)|
+-----------------------------------------------------------------------------------+
                                          |
                                          v  [Stage 01: validate_extraction.py]
+-----------------------------------------------------------------------------------+
| 01_extracted.json: Validated LinkML Container (structures, places, guthis, etc.)  |
+-----------------------------------------------------------------------------------+
                                          |
                                          v  [Stage 02: resolve_entities.py]
+-----------------------------------------------------------------------------------+
| 02_resolved.json + 02_review_queue.json: Grounded to Wikidata, Getty, LUX, Gazette|
+-----------------------------------------------------------------------------------+
                                          |
                                          v  [Stage 03: map_to_rdf.py / heritagegraph.yaml]
+-----------------------------------------------------------------------------------+
| 03_graph.ttl: Deterministic RDF Turtle Graph with graded SKOS &amp; sovereign URIs    |
+-----------------------------------------------------------------------------------+
                                          |
                                          v  [Stage 04: validate.py / pySHACL]
+-----------------------------------------------------------------------------------+
| 04_shacl_report.json: Quality Gate Conformance &amp; Shape Coverage Metrics           |
+-----------------------------------------------------------------------------------+
</code></pre>

<h1 id="stage-01-ingestion--preprocessing">Stage 01: Ingestion &amp; Preprocessing</h1>
<ul>
<li data-marpit-fragment="1"><strong>Problem</strong>: Raw field reports and spreadsheets have messy OCR breaks, inconsistent headers, and unstandardized cultural terminology.</li>
<li data-marpit-fragment="2"><strong>Scripts</strong>:
<ul>
<li data-marpit-fragment="3"><code>ingest_raw.py</code>: Format router dispatching to PDF, CSV, XLSX, or JSON parsers.</li>
<li data-marpit-fragment="4"><code>ingest_pdf.py</code>: Uses <code>pypdf</code> to extract text, strip running headers/footers, and rejoin hyphenated line breaks.</li>
<li data-marpit-fragment="5"><code>ingest_tabular.py</code>: Distinguishes structured administrative metadata from free-text architectural descriptions.</li>
<li data-marpit-fragment="6"><code>recognize_heritage.py</code>: Regex and lexicon scanning for living heritage elements.</li>
</ul>
</li>
<li data-marpit-fragment="7"><strong>Output (<code>00_preprocessed.json</code>)</strong>:
<ul>
<li data-marpit-fragment="8">Normalized text chunks paired with pre-identified candidate tags for Guthis, Eras, and Architectural Styles.</li>
</ul>
</li>
</ul>
</section>

<h1 id="stage-01-living-heritage-scanner">Stage 01: Living Heritage Scanner</h1>
<p>[<code>recognize_heritage.py</code>](file:///c:/Users/nabin/Desktop/myall/hg-skill/skills/01_heritage-extract/scripts/recognize_heritage.py) scans text against controlled vocabularies defined in LinkML enums:</p>
<table>
<thead>
<tr>
<th>Category</th>
<th>Recognized Patterns &amp; Permissible Values</th>
<th>Ontology Mapping</th>
</tr>

<tbody>
<tr>
<td><strong>Architectural Style</strong></td>
<td><code>Pagoda</code>, <code>Shikhara</code>, <code>Chaitya</code>, <code>Stupa</code>, <code>Dome</code></td>
<td><code>heritageGraph:hasArchitecturalStyle</code></td>

<td><code>heritageGraph:Guthi</code></td>
</tr>
<tr>
<td><strong>Calendar Eras</strong></td>
<td><code>Nepal Sambat (NS)</code>, <code>Vikram Sambat (VS)</code>, <code>Shaka Sambat (ŚS)</code>, <code>CE/BCE</code></td>

<h1 id="stage-02-entity-resolution--grounding">Stage 02: Entity Resolution &amp; Grounding</h1>
<ul>
<li data-marpit-fragment="1"><strong>Problem</strong>: Kathmandu Valley heritage contains rampant homonyms (e.g. 50+ <em>Radha Krishna</em> or <em>Narayan</em> temples) and local institutions unindexed by global authorities.</li>
<li data-marpit-fragment="2"><strong>Script</strong>: [<code>resolve_entities.py</code>](file:///c:/Users/nabin/Desktop/myall/hg-skill/skills/02_heritage-entity-resolution/scripts/resolve_entities.py)</li>
<li data-marpit-fragment="3"><strong>Multi-Authority Lookup</strong>:
<ul>
<li data-marpit-fragment="4"><strong>Local Gazetteers</strong> (<code>gazetteers/*.csv</code>): High-confidence internal index of local Newar places, toles, and historical monuments.</li>
<li data-marpit-fragment="5"><strong>Wikidata</strong> (<code>lookup_wikidata.py</code>): Public search via <code>wbsearchentities</code> API.</li>
<li data-marpit-fragment="6"><strong>Getty Vocabularies</strong> (<code>lookup_getty.py</code>): SPARQL queries against Getty AAT (concepts/materials), ULAN (artists), and TGN (places).</li>
<li data-marpit-fragment="7"><strong>Yale LUX</strong> (<code>lookup_lux.py</code>): Linked Art REST queries for museum items, collections, concepts, and places.</li>
</ul>
</li>
</ul>
</section>

<h1 id="stage-02-sovereign-uris--graded-skos">Stage 02: Sovereign URIs &amp; Graded SKOS</h1>
<ul>
<li data-marpit-fragment="1"><strong>Sovereign URI Policy</strong>:
<ul>
<li data-marpit-fragment="2">HeritageGraph <strong>never replaces an entity's primary subject URI</strong> with an external authority URI.</li>
<li data-marpit-fragment="3">Every entity receives a canonical HeritageGraph URI:<br />
<code>https://cair-nepal.org/heritagegraph/&lt;kind&gt;/&lt;slug&gt;</code></li>
<li data-marpit-fragment="4">External authorities are linked as outbound assertions.</li>
</ul>
</li>
<li data-marpit-fragment="5"><strong>Graded Mapping Semantics (Ticket #26)</strong>:
<ul>
<li data-marpit-fragment="6">Instead of flattening all links into <code>skos:exactMatch</code>, Stage 2 captures explicit semantic relationship degrees:
<ul>
<li data-marpit-fragment="7"><code>exact</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> <code>skos:exactMatch</code> (Identical concept)</li>

<h1 id="stage-03-deterministic-rdf-triplifier">Stage 03: Deterministic RDF Triplifier</h1>
<ul>
<li data-marpit-fragment="1"><strong>Problem</strong>: Triplification must be strictly deterministic, reproducible, and verifiable. Direct code hacks lead to schema drift.</li>
<li data-marpit-fragment="2"><strong>Script</strong>: [<code>map_to_rdf.py</code>](file:///c:/Users/nabin/Desktop/myall/hg-skill/skills/03_heritage-rdf-mapper/scripts/map_to_rdf.py)</li>
<li data-marpit-fragment="3"><strong>Inputs</strong>: <code>02_resolved.json</code> + Declarative Mapping (<code>heritagegraph.yaml</code>).</li>
<li data-marpit-fragment="4"><strong>Core Characteristics</strong>:
<ul>
<li data-marpit-fragment="5">Pure Python execution using <strong>RDFLib</strong> (zero external dependencies).</li>
<li data-marpit-fragment="6">Sub-second execution for hundreds of entities.</li>
<li data-marpit-fragment="7">Emits typed RDF statements with bound prefixes (<code>heritageGraph:</code>, <code>crm:</code>, <code>skos:</code>, <code>owl:</code>, <code>prov:</code>).</li>
<li data-marpit-fragment="8">Captures unmapped fields in execution metrics to prevent silent data loss.</li>
</ul>
</li>
</ul>
</section>

<h1 id="stage-03-mapping-generation-from-linkml">Stage 03: Mapping Generation from LinkML</h1>
<ul>
<li data-marpit-fragment="1"><strong>Generator Script</strong>: [<code>generate_mapping.py</code>](file:///c:/Users/nabin/Desktop/myall/hg-skill/skills/03_heritage-rdf-mapper/scripts/generate_mapping.py)</li>
<li data-marpit-fragment="2"><strong>Single Source of Truth</strong>:
<ul>
<li data-marpit-fragment="3">Instead of hand-authoring mapping rules, <code>generate_mapping.py</code> compiles <code>schemas/HeritageGraph.yaml</code> directly into:
<ol>
<li><strong>Native Mapping</strong>: <code>heritagegraph.yaml</code> (executed by <code>map_to_rdf.py</code>).</li>
<li><strong>W3C YARRRML</strong>: <code>heritagegraph.yarrrml.yaml</code> (exported for RML engines).</li>
</ol>
</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>Hand-Written Overrides (<code>heritagegraph.overrides.yaml</code>)</strong>:
<ul>
<li data-marpit-fragment="5">Layers surgical exceptions over generated rules (e.g., mapping <code>note</code> to <code>rdfs:comment</code> or suppressing inherited slots).</li>
</ul>
</li>
<li data-marpit-fragment="6"><strong>CI Freshness Gate</strong>:<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">python skills/03_heritage-rdf-mapper/scripts/generate_mapping.py --check
</code></pre>
<em>Exits with code 1 if committed mappings drift from the LinkML schema.</em></li>
</ul>

<h1 id="stage-04-quality-gate--pyshacl-validation">Stage 04: Quality Gate &amp; pySHACL Validation</h1>
<ul>
<li data-marpit-fragment="1"><strong>Problem</strong>: Syntactically valid RDF can still violate semantic constraints (missing coordinates, untyped references, invalid calendar enums).</li>
<li data-marpit-fragment="2"><strong>Script</strong>: [<code>validate.py</code>](file:///c:/Users/nabin/Desktop/myall/hg-skill/skills/04_heritage-shacl-validate/scripts/validate.py)</li>
<li data-marpit-fragment="3"><strong>Engine</strong>: <strong>pySHACL</strong> validating <code>03_graph.ttl</code> against [<code>HeritageGraph.shacl.ttl</code>](file:///c:/Users/nabin/Desktop/myall/hg-skill/schemas/HeritageGraph.shacl.ttl).</li>
<li data-marpit-fragment="4"><strong>Prevention of Vacuous Passes</strong>:
<ul>
<li data-marpit-fragment="5">A validator that tests an empty graph or a graph with incorrect namespace prefixes might report <code>CONFORMS: True</code> while checking zero shapes.</li>
<li data-marpit-fragment="6">Stage 4 computes <strong>per-shape coverage</strong>. If zero shapes match the data graph, it marks the run as a <strong>Vacuous Pass Failure</strong> (<code>&quot;vacuous&quot;: true</code>) and exits with code 1.</li>
</ul>
</li>
</ul>
</section>

<h1 id="linkml-schema-as-authoritative-backbone">LinkML Schema as Authoritative Backbone</h1>
<ul>
<li data-marpit-fragment="1"><strong>File</strong>: <code>schemas/HeritageGraph.yaml</code> (v1.0.1)</li>
<li data-marpit-fragment="2">LinkML (Linked Open Data Modeling Language) provides:
<ol>
<li>Human-readable YAML object-oriented modeling with inheritance (<code>is_a</code>).</li>
<li>Single source of truth compiling into:
<ul>
<li>Python dataclasses.</li>
<li>JSON Schema for Stage 1 validation.</li>
<li>OWL / RDF Turtle ontology ([<code>HeritageGraph.ttl</code>](file:///c:/Users/nabin/Desktop/myall/hg-skill/schemas/HeritageGraph.ttl)).</li>
<li>SHACL validation shapes ([<code>HeritageGraph.shacl.ttl</code>](file:///c:/Users/nabin/Desktop/myall/hg-skill/schemas/HeritageGraph.shacl.ttl)).</li>
<li>Pipeline mapping configurations ([<code>heritagegraph.yaml</code>](file:///c:/Users/nabin/Desktop/myall/hg-skill/skills/03_heritage-rdf-mapper/assets/mappings/heritagegraph.yaml)).</li>
</ul>
</li>
</ol>
</li>
</ul>
<p><em>Eliminates manual discrepancies across schema, validation, and serialization tiers.</em></p>
</section>

<h1 id="dual-track-ontology-modeling">Dual-Track Ontology Modeling</h1>
<p><code>hg-skill</code> supports two distinct semantic representations:</p>
<table>
<thead>
<tr>
<th>Dimension</th>
<th>Native HeritageGraph (<code>heritagegraph.yaml</code>)</th>
<th>CIDOC-CRM (<code>cidoc-crm.yaml</code>)</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Target Audience</strong></td>
<td>Nepal Heritage researchers, SPARQL endpoints</td>
<td>International museum interoperability</td>
</tr>
<tr>
<td><strong>Classes</strong></td>
<td><code>heritageGraph:ArchitecturalStructure</code>, <code>Guthi</code>, <code>Stupa</code></td>
<td><code>crm:E22_Human-Made_Object</code>, <code>E39_Actor</code></td>
</tr>
<tr>
<td><strong>Living Heritage</strong></td>
<td>Direct properties (<code>managedByGuthi</code>, <code>enshrinesDeity</code>)</td>
<td>Reified event nodes (<code>E12_Production</code>, <code>E7_Activity</code>)</td>
</tr>
<tr>
<td><strong>Shape Validation</strong></td>
<td>Comprehensive (<code>HeritageGraph.shacl.ttl</code>)</td>
<td>Permissive subset (<code>--allow-crm-only</code>)</td>
</tr>
<tr>
<td><strong>Pipeline Default</strong></td>
<td><strong>Active Default</strong> (ADR-0004)</td>
<td>Alternate export target</td>
</tr>
</tbody>
</table>
</section>

<h1 id="external-lod-connectivity-lux-wikidata-getty">External LOD Connectivity: LUX, Wikidata, Getty</h1>
<p>Implemented lookup adapters under <code>skills/02_heritage-entity-resolution/scripts/</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>           +---------------------------------------------+
           |         lookup_lux.py (Yale LUX)            |
           | REST Search API &amp; 'luxy' Linked Art wrapper |
           +---------------------------------------------+
                                 │
           +---------------------------------------------+
           |        lookup_wikidata.py (Wikidata)        |
           | wbsearchentities REST API (Q-identifiers)   |
           +---------------------------------------------+
                                 │
           +---------------------------------------------+
           |          lookup_getty.py (Getty LOD)        |
           | SPARQL endpoint (AAT, ULAN, TGN vocabularies)|
           +---------------------------------------------+
</code></pre>
<p><em>Resilient design</em>: Each client handles network timeouts, character encoding, and HTTP errors gracefully, falling back to local minting without crashing the pipeline.</p>
</section>

<h1 id="yarrrml--rml-interoperability-adr-0005">YARRRML / RML Interoperability (ADR-0005)</h1>
<ul>
<li data-marpit-fragment="1"><strong>Why not direct CSV-to-TTL via RML?</strong>
<ul>
<li data-marpit-fragment="2">Direct RML bypasses living heritage NER, diacritic folding, and human review.</li>
<li data-marpit-fragment="3">Standard RML engines introduce heavy non-Python dependencies (Java JRE or Node.js).</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>The Solution (ADR-0005)</strong>:
<ul>
<li data-marpit-fragment="5">Keep the pure-Python pipeline (<code>map_to_rdf.py</code>) as the fast in-repo engine.</li>
<li data-marpit-fragment="6">Generate standards-compliant <strong>YARRRML</strong> (<code>heritagegraph.yarrrml.yaml</code>) targeting <code>02_resolved.json</code>:</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-attr">mappings:</span>
  <span class="hljs-attr">structures:</span>
    <span class="hljs-attr">sources:</span>
      <span class="hljs-bullet">-</span> [<span class="hljs-string">&#x27;02_resolved.json~jsonpath&#x27;</span>, <span class="hljs-string">&#x27;$.structures[*]&#x27;</span>]
    <span class="hljs-attr">s:</span> <span class="hljs-string">$(id)</span>
    <span class="hljs-attr">po:</span>
      <span class="hljs-bullet">-</span> [<span class="hljs-string">a</span>, <span class="hljs-string">heritageGraph:ArchitecturalStructure</span>]
      <span class="hljs-bullet">-</span> [<span class="hljs-string">rdfs:label</span>, <span class="hljs-string">$(name)</span>]
      <span class="hljs-bullet">-</span> [<span class="hljs-string">heritageGraph:managedByGuthi</span>, <span class="hljs-string">$(managed_by_guthi)~iri</span>]
      <span class="hljs-bullet">-</span> [<span class="hljs-string">skos:exactMatch</span>, <span class="hljs-string">$(resolution.uri)~iri</span>]
</code></pre>
</li>
</ul>
</section>

<h1 id="key-test-guarantees">Key Test Guarantees</h1>
<ol>
<li><strong>Anti-Vacuity Guarantee</strong> (<code>test_stage4_coverage.py</code>):
<ul>
<li data-marpit-fragment="1">Confirms that Stage 4 explicitly fails runs where zero target nodes match SHACL shapes, preventing false-positive passes.</li>
</ul>
</li>
<li><strong>Deterministic Freshness Gate</strong> (<code>test_stage3_generate_mapping.py</code>):
<ul>
<li data-marpit-fragment="2">Tests compare committed mappings (<code>heritagegraph.yaml</code>, <code>heritagegraph.yarrrml.yaml</code>) against the schema. If an engineer updates <code>HeritageGraph.yaml</code> without regenerating mappings, CI immediately goes red.</li>
</ul>
</li>
<li><strong>Graded Relationship Integrity</strong> (<code>test_stage3_entity_links.py</code>):
<ul>
<li data-marpit-fragment="3">Verifies that <code>exact</code>, <code>close</code>, <code>broad</code>, <code>narrow</code>, and <code>sameAs</code> produce the precise RDF predicates without corrupting subject identifiers.</li>
</ul>
</li>
<li><strong>Human Feedback Persistence</strong> (<code>test_interactive_resolution.py</code>):
<ul>
<li data-marpit-fragment="4">Verifies that curator decisions in interactive mode persist into <code>curated-links.csv</code> and reload automatically on subsequent runs.</li>
</ul>
</li>
</ol>
</section>

<h1 id="technical-roadmap--next-horizons">Technical Roadmap &amp; Next Horizons</h1>
<ol>
<li><strong>Epigraphic Sanskrit &amp; Newar Script Recognition</strong>:
<ul>
<li data-marpit-fragment="1">Extend Stage 1 to support Inscription Text analysis with <em>Ranjana</em>, <em>Prachalit</em>, and <em>Devanagari</em> transliteration normalization.</li>
</ul>
</li>
<li><strong>Automated Complex Disambiguation</strong>:
<ul>
<li data-marpit-fragment="2">Implement vector-based semantic similarity on monument descriptions to rank candidate matches in <code>fetch_candidates()</code> prior to human curation.</li>
</ul>
</li>
<li><strong>Federated SPARQL Integration</strong>:
<ul>
<li data-marpit-fragment="3">Direct SPARQL endpoint synchronization with CAIR-Nepal's triple store (<code>https://cair-nepal.org/sparql</code>).</li>
</ul>
</li>
<li><strong>Autonomous Ingestion Agent Teams</strong>:
<ul>
<li data-marpit-fragment="4">Multi-agent execution for scraping living heritage records from online archives (e.g. DANAM, Heidelberg CATS) into standardized <code>hg-skill</code> runs.</li>
</ul>
</li>
</ol>
</section>

<h1 id="summary-of-architectural-contributions">Summary of Architectural Contributions</h1>
<ul>
<li data-marpit-fragment="1"><strong>Domain-Grounded AI</strong>: Combines LLM semantic extraction with deterministic LinkML schemas, preventing hallucination while capturing intricate living heritage.</li>
<li data-marpit-fragment="2"><strong>Semantic Sovereignty</strong>: Honors international LOD standards (Wikidata, Getty, LUX, CIDOC-CRM) while asserting sovereign, stable URIs for Nepal's heritage assets.</li>
<li data-marpit-fragment="3"><strong>Compounding Human Knowledge</strong>: Every human curation decision in Stage 2 enriches <code>curated-links.csv</code>, making the pipeline smarter and faster on future datasets.</li>
<li data-marpit-fragment="4"><strong>Reproducible Heritage Engineering</strong>: Cryptographic provenance manifests (<code>manifest.json</code>) and anti-vacuous SHACL gates ensure data contributed to HeritageGraph is verified, defensible, and preservation-grade.</li>
</ul>
</section>
